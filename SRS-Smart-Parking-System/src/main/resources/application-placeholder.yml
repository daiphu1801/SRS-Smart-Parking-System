spring:

  data:
    redis:
      host: [YOUR_REDIS_HOST_OR_IP]
      port: 6379
      username: default
      password: [YOUR_REDIS_PASSWORD]

      ssl:
          enabled: true
      timeout: 3000ms
      lettuce:
          pool:
            max-active: 50
            max-idle: 10
            min-idle: 2
            max-wait: 2000ms
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: "1"

  security:
    oauth2:
      resourceserver:
        jwt:
          # Đưa đường link chứa Public Key vào đây
          jwk-set-uri: https://[YOUR_SUPABASE_PROJECT_ID].supabase.co/auth/v1/.well-known/jwks.json
  application:
    name: smart-parking-core

  datasource:
    url: jdbc:postgresql://[YOUR_DB_HOST]:5432/postgres?sslmode=require&stringtype=unspecified
    username: postgres.[YOUR_SUPABASE_PROJECT_ID]
    password: [YOUR_DB_PASSWORD]
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Dùng Flyway/Liquibase để quản lý schema
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  kafka:
    # URL Kết nối tới Kafka Broker
    bootstrap-servers: [KAFKA_BROKER_URL_OR_HOST_DOCKER_INTERNAL]:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: parking-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

logging:
  level:
    org.springframework.security: DEBUG
    vn.edu.fpt.smartparking: DEBUG

server:
  port: 8080
