apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://pkgs.tailscale.com/helmcharts'
    chart: tailscale-operator
    targetRevision: 1.98.4
    helm:
      values: |
        oauth:
          clientId: <YOUR_TAILSCALE_OAUTH_CLIENT_ID>
          clientSecret: <YOUR_TAILSCALE_OAUTH_CLIENT_SECRET>
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
