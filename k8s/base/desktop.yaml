apiVersion: apps/v1
kind: Deployment
metadata:
  name: sps-desktop-deployment
  labels:
    app: sps-desktop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sps-desktop
  template:
    metadata:
      labels:
        app: sps-desktop
    spec:
      # Cho phép pod resolve api.sps.local → ingress controller
      # để traffic đi đúng qua ingress như production thật
      hostAliases:
        - ip: "10.96.58.213"   # ClusterIP của ingress-nginx-controller
          hostnames:
            - "api.sps.local"
      containers:
        - name: desktop-ai-container
          image: sps-desktop-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8550

          env:
            - name: API_BASE_URL
              value: "http://api.sps.local/api/v1"

---
apiVersion: v1
kind: Service
metadata:
  name: sps-desktop-service
spec:
  type: ClusterIP
  selector:
    app: sps-desktop
  ports:
    - protocol: TCP
      port: 8550
      targetPort: 8550
