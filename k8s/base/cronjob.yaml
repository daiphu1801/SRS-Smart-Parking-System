apiVersion: batch/v1
kind: CronJob
metadata:
  name: sps-cron-update-booking
spec:
  schedule: "1 0 * * *"
  timeZone: "Asia/Ho_Chi_Minh"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: sps-cronjob
        spec:
          containers:
          - name: curl-client
            image: curlimages/curl:latest
            imagePullPolicy: IfNotPresent
            command:
            - "curl"
            - "-fsS"
            - "-X"
            - "POST"
            - "http://sps-backend-service:8080/api/internal/jobs/update-booking-status"
          restartPolicy: OnFailure

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sps-cron-notify-expiring
spec:
  schedule: "0 6 * * *"
  timeZone: "Asia/Ho_Chi_Minh"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: sps-cronjob
        spec:
          containers:
          - name: curl-client
            image: curlimages/curl:latest
            imagePullPolicy: IfNotPresent
            command:
            - "curl"
            - "-fsS"
            - "-X"
            - "POST"
            - "http://sps-backend-service:8080/api/internal/jobs/send-expired-booking-notification"
          restartPolicy: OnFailure
