apiVersion: apps/v1
kind: Deployment
metadata:
  name: sps-desktop-deployment
spec:
  template:
    spec:
      # Inject DNS resolution cho api.sps.local → ingress controller ClusterIP
      # Pod chạy trong cluster cũng đi qua ingress như production thật
      hostAliases:
        - ip: "10.96.58.213"
          hostnames:
            - "api.sps.local"
      containers:
        - name: desktop-ai-container
          env:
            - name: API_BASE_URL
              value: "http://api.sps.local/api/v1"
