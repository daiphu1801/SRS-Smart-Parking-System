apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sps-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sps-backend-deployment
  minReplicas: 1
  maxReplicas: 7
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
