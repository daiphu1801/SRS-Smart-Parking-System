spring:
  application:
    name: smart-parking-core

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_parking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_POOL_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: smart-parking-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.smartparking.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    com.smartparking: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:INFO}

# App custom config
app:
  jwt:
    secret: ${JWT_SECRET:change_me_dev_only}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

supabase:
  jwt-secret: ${SUPABASE_JWT_SECRET:dev_supabase_jwt_secret_change_me}

  settings:
    file-path: ${SETTINGS_PATH:../python_edge_desktop/config/settings.json}

  sepay:
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:change_me}
    bank-account: ${SEPAY_BANK_ACCOUNT:0123456789}
    bank-name: ${SEPAY_BANK_NAME:MB}
    account-name: ${SEPAY_ACCOUNT_NAME:CONG TY SMART PARKING}

  zns:
    access-token: ${ZNS_ACCESS_TOKEN:change_me}
    app-id: ${ZNS_APP_ID:change_me}
    template-otp: ${ZNS_TEMPLATE_OTP:1234}
    template-reminder: ${ZNS_TEMPLATE_REMINDER:5678}
    template-confirm: ${ZNS_TEMPLATE_CONFIRM:9012}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
