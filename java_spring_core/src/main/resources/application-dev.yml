spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_parking}
    username: ${SPRING_DATASOURCE_USERNAME:smart_parking}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

logging:
  level:
    com.smartparking: DEBUG
    org.springframework.security: DEBUG
    org.springframework.kafka: WARN
    org.apache.kafka: ERROR
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# Dev overrides - dùng giá trị tạm, không commit secret thật lên Git
app:
  jwt:
    secret: ${APP_JWT_SECRET:change_me}
    expiration-ms: 86400000 # 1 ngày
  settings:
    file-path: ../python_edge_desktop/config/settings.json
  sepay:
    webhook-secret: ${APP_SEPAY_WEBHOOK_SECRET:change_me}
    bank-account: ${APP_SEPAY_BANK_ACCOUNT:change_me}
    bank-name: ${APP_SEPAY_BANK_NAME:change_me}
    account-name: ${APP_SEPAY_ACCOUNT_NAME:change_me}
  zns:
    access-token: ${ZNS_ACCESS_TOKEN:change_me}
    app-id: ${ZNS_APP_ID:change_me}
    template-otp: ${ZNS_TEMPLATE_OTP:1234}
    template-reminder: ${ZNS_TEMPLATE_REMINDER:5678}
    template-confirm: ${ZNS_TEMPLATE_CONFIRM:9012}

supabase:
  jwt-secret: ${SUPABASE_JWT_SECRET:change_me}
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:change_me}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:change_me}
