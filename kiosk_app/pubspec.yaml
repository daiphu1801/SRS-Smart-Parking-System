name: smart_parking_mobile
description: Smart Parking System mobile app
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  provider: ^6.1.5+1
  go_router: ^14.8.1
  get_it: ^8.3.0
  shared_preferences: ^2.5.5
  http: ^1.2.2
  google_fonts: ^6.3.3
  intl: ^0.20.2
  fl_chart: ^1.2.0
  equatable: ^2.0.8
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
