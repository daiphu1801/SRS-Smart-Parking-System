name: AI Desktop CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sps_desktop/**'
      - '.github/workflows/ci-desktop.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./sps_desktop
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sps-desktop-app:${{ github.sha }}

      - name: Update K8s Manifest with new Image Version
        run: |
          sed -i "s|image: sps-desktop-app:.*|image: sps-desktop-app:${{ github.sha }}|g" k8s/demo/desktop.yaml

      - name: Commit and Push K8s Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/demo/desktop.yaml
          git commit -m "Auto-update Desktop image version to ${{ github.sha }}"
          git push
