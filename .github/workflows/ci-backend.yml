name: Backend CI
on:
  push:
    branches: [ "main" ]
    paths:
      - 'SRS-Smart-Parking-System/**'
      - '.github/workflows/ci-backend.yml'
permissions:
  contents: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        
      - name: Set up JDK 21 (Fast-Fail Linting)
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Check Syntax (Fast-Fail Linting)
        run: |
          cd SRS-Smart-Parking-System
          mvn clean compile -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./SRS-Smart-Parking-System
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/srs-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/srs-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/srs-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
