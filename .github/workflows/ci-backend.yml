name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'SRS-Smart-Parking-System/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./SRS-Smart-Parking-System
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/srs-backend:${{ github.sha }}

      - name: Update K8s Manifest with new Image Version
        run: |
          sed -i "s|image: srs-backend:.*|image: srs-backend:${{ github.sha }}|g" k8s/base/backend.yaml

      - name: Commit and Push K8s Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/backend.yaml
          git commit -m "Auto-update Backend image version to ${{ github.sha }}"
          git push
